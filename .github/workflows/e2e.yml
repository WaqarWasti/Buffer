name: Emulator test
on:
  push:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ci/e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-output
          path: ci-out/
      - name: Show results
        if: always()
        run: |
          echo "=== RESULTS ==="; cat ci-out/result.txt
          echo "=== CRASHES ==="; cat ci-out/crashes.txt || true
          echo "=== FOCUS ==="; grep -H . ci-out/focus-*.txt || true
          echo "=== AM START ==="; cat ci-out/am-start-dashboard.txt || true
          echo "=== DUMP LOG ==="; cat ci-out/dump-log.txt || true
          for f in ci-out/*.xml; do echo "=== TEXTS in $f ==="; grep -o 'text="[^"]\+"' "$f" | head -25; done || true
          echo "=== LOGCAT (app.buffer, activity manager) ==="; grep -E "app\.buffer|Buffer(Activity|App)|AppWatcher|ActivityTaskManager.*START|AccessibilityManagerService" ci-out/logcat.txt | tail -60 || true
      - name: Fail if any check failed
        run: '! grep -q "^FAIL" ci-out/result.txt'
